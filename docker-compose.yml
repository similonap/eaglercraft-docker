services:
  eaglercraft:
    build: .
    container_name: eaglercraft-server
    restart: unless-stopped

    ports:
      # Vanilla TCP + Eaglercraft WebSocket both use this port
      - "${SERVER_PORT:-25565}:25565"

    volumes:
      # Persistent server state: worlds, plugin configs, logs — directly in ./data/
      - ./data:/data
      # Override server.properties without rebuilding the image
      - ./config/server.properties:/config/server.properties:ro

    environment:
      # JVM heap size — set both -Xmx and -Xms to avoid resize pauses
      MEMORY: "${MEMORY:-2G}"

    # Keep stdin open so you can attach with `docker attach eaglercraft-server`
    # and run in-game console commands
    stdin_open: true
    tty: true

    # Give the server time to save worlds and kick players cleanly
    stop_grace_period: 30s

    networks:
      - web  # Add this 
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eagler-ws.rule=Host(`mc.assimilate.be`) && PathPrefix(`/server`)"
      - "traefik.http.routers.eagler-ws.entrypoints=websecure"
      - "traefik.http.routers.eagler-ws.tls=true"
      - "traefik.http.routers.eagler-ws.tls.certresolver=production"
      - "traefik.http.services.eagler-ws.loadbalancer.server.port=25565"

  client:
    build: ./client
    container_name: eaglercraft-client
    restart: unless-stopped

    ports:
      # Browser-accessible port for the web client
      - "${CLIENT_PORT:-8080}:80"

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mc.rule=Host(`mc.assimilate.be`)"
      - "traefik.http.routers.mc.entrypoints=web,websecure"
      - "traefik.http.routers.mc.tls=true"
      - "traefik.http.routers.mc.tls.certresolver=production" # Ensure 'myresolver' matches your Traefik Let's Encrypt resolver name
    networks:
      - web
    environment:
      # Public hostname or IP address players use to reach this machine.
      # Must be reachable from the player's browser — not a Docker-internal name.
      # Change to your public IP or domain when hosting for others.
      SERVER_HOST: "${SERVER_HOST:-localhost}"
      # Must match the host port mapped for the eaglercraft service above
      SERVER_PORT: "${SERVER_PORT:-25565}"
      # Display name shown in the client's server list
      SERVER_NAME: "${SERVER_NAME:-EaglercraftX}"
      # Set to "false" to use ws:// instead of wss:// (e.g. local dev without TLS)
      SERVER_TLS: "${SERVER_TLS:-true}"

networks:
  web:
    # In production with Traefik, set external: true and name: traefik_default
    # so containers join the Traefik network. Locally, leave this as-is.
    external: false